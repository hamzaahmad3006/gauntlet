# Fly.io — single machine, API + dashboard + in-process worker, SQLite on a volume.
#   fly launch --no-deploy --copy-config --config infra/fly.toml
#   fly volumes create gauntlet_data --size 1
#   fly secrets set SECRET_ENCRYPTION_KEY=... GROQ_API_KEY=... ELEVENLABS_API_KEY=... SPEECHMATICS_API_KEY=...
#   fly deploy --config infra/fly.toml
app = "gauntlet"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  ALLOW_GUEST = "true"
  PORT = "8000"
  PUBLIC_FIXTURE_HOST = "http://127.0.0.1:8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "gauntlet_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
