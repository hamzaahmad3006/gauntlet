name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - name: Lint
        run: ruff check backend/gauntlet --select F,E9
      - name: Unit, API and real-time media tests
        working-directory: backend
        run: python -m pytest -q
      - name: Calibration gate (exit 5 if the bound exceeds 50 ms)
        run: python calibration/run_calibration.py --out /tmp/calibration.csv

  postgres:
    # Production runs on PostgreSQL; the API and full run lifecycle are re-run against it here.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gauntlet
          POSTGRES_PASSWORD: gauntlet
          POSTGRES_DB: gauntlet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gauntlet" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gauntlet:gauntlet@localhost:5432/gauntlet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - name: API and lifecycle tests on PostgreSQL
        working-directory: backend
        run: python -m pytest -q tests/api tests/media/test_lifecycle.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npx vite build
