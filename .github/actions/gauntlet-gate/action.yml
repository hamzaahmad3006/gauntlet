name: GAUNTLET gate
description: Run a GAUNTLET voice-agent benchmark on a pull request, compare it to the target's baseline, and fail the check on a regression.
branding:
  icon: activity
  color: green
inputs:
  api-key:
    description: GAUNTLET API key with run:create, run:read and gate:execute (store as a repository secret)
    required: true
  config:
    description: Path to gauntlet.yaml
    default: gauntlet.yaml
  api-url:
    description: Override api_url from the config file
    default: ""
  gauntlet-ref:
    description: Git ref of the GAUNTLET CLI to install
    default: main
outputs:
  verdict:
    description: passed | failed | ungatable | error
    value: ${{ steps.gate.outputs.verdict }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install the GAUNTLET CLI
      shell: bash
      run: pip install --quiet "gauntlet @ git+https://github.com/hamzaahmad3006/gauntlet@${{ inputs.gauntlet-ref }}#subdirectory=backend"
    - name: Run, wait and gate
      id: gate
      shell: bash
      env:
        GAUNTLET_API_KEY: ${{ inputs.api-key }}
        GAUNTLET_API_URL: ${{ inputs.api-url }}
      run: |
        echo "::add-mask::$GAUNTLET_API_KEY"
        [ -z "$GAUNTLET_API_URL" ] && unset GAUNTLET_API_URL
        set +e
        gauntlet ci --config "${{ inputs.config }}" --comment-out gauntlet-comment.md --verdict-out gauntlet-verdict.json
        code=$?
        set -e
        case $code in
          0) echo "verdict=passed" >> "$GITHUB_OUTPUT" ;;
          2) echo "verdict=failed" >> "$GITHUB_OUTPUT" ;;
          3) echo "verdict=ungatable" >> "$GITHUB_OUTPUT" ;;
          *) echo "verdict=error" >> "$GITHUB_OUTPUT" ;;
        esac
        [ -f gauntlet-comment.md ] && cat gauntlet-comment.md >> "$GITHUB_STEP_SUMMARY"
        echo "$code" > gauntlet-exit-code
    - name: Post or update the pull-request comment
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('gauntlet-comment.md')) return;
          const body = fs.readFileSync('gauntlet-comment.md', 'utf8');
          const marker = '<!-- gauntlet-gate -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const mine = comments.find(c => c.body && c.body.includes(marker));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
    - name: Fail the check on a breach or error
      shell: bash
      run: |
        code=$(cat gauntlet-exit-code)
        if [ "$code" = "2" ]; then echo "::error::GAUNTLET gate failed: a metric regressed against the baseline"; exit 1; fi
        if [ "$code" != "0" ]; then echo "::error::GAUNTLET could not gate this run (exit $code) — infrastructure or ungatable, not a regression"; exit 1; fi
