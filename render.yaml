# Render Blueprint — single-container deployment: API + dashboard + in-process worker, SQLite on a disk.
# Deploy: Render dashboard → New → Blueprint → select this repository. Render prompts for every
# `sync: false` value (provider keys); leave any provider you do not use empty — its documented fallback
# is used and the dashboard shows it as "fallback". Secrets never live in this file.
services:
  - type: web
    name: gauntlet
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    plan: starter            # 0.5 CPU / 512 MB. "standard" (1 CPU) keeps timing tighter at higher concurrency.
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: gauntlet-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: ALLOW_GUEST
        value: "true"
      - key: PUBLIC_FIXTURE_HOST
        value: http://127.0.0.1:8000
      - key: MAX_CALLS_PER_WORKER
        value: "6"
      - key: MAX_CONCURRENT_CALLS
        value: "8"
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SPEECHMATICS_API_KEY
        sync: false
      - key: CALLER_LLM_TIMEOUT_MS
        value: "800"
