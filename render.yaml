# Render Blueprint — single container (API + dashboard + in-process worker) on the Free plan, with no
# database and no disk, so nothing here asks for a payment method.
# Deploy: Render dashboard → New → Blueprint → select this repository. Render prompts for every
# `sync: false` value (provider keys); leave any provider you do not use empty — its documented fallback is
# used and the dashboard shows it as "fallback". Secrets never live in this file.
#
# Free plan limits that matter here: the service sleeps after 15 minutes without traffic (the first request
# then takes about a minute), it has 0.1 CPU and 512 MB, and its filesystem is not persistent — runs live in
# SQLite inside the container and are lost on a restart, after which the workspace reseeds itself with the
# bundled agents and suite. Real-time timing needs CPU, so concurrency is capped at 2 and runs beyond the
# rig's capacity are flagged as rig saturation; numbers produced here are not comparable with the committed
# benchmarks. For tighter timing and runs that survive a restart, switch to `plan: starter` and add a
# `databases:` block with `fromDatabase` DATABASE_URL — both are paid.
services:
  - type: web
    name: gauntlet
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: ALLOW_GUEST
        value: "true"
      - key: MAX_CALLS_PER_WORKER
        value: "2"
      - key: MAX_CONCURRENT_CALLS
        value: "2"
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SPEECHMATICS_API_KEY
        sync: false
      - key: CALLER_LLM_TIMEOUT_MS
        value: "1200"
