[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet"
version = "0.1.0"
description = "The infrastructure crash-test rig for real-time voice AI."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "fakeredis>=2.23",
  "websockets>=13.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "argon2-cffi>=23.1",
  "cryptography>=43.0",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "soundfile>=0.12",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
livekit = ["livekit>=0.17", "livekit-api>=0.7"]
storage = ["boto3>=1.34"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "hypothesis>=6.112", "ruff>=0.6"]

[project.scripts]
gauntlet = "gauntlet.cli.main:app"

[tool.setuptools.packages.find]
include = ["gauntlet*"]

[tool.setuptools.package-data]
gauntlet = ["suites/schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "realtime: exercises real-time audio pacing over loopback sockets (slower)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
